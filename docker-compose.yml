services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: portalete
      POSTGRES_USER: portalete
      POSTGRES_PASSWORD: portalete
    ports:
      - "5434:5432"
    volumes:
      - portalete_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portalete -d portalete"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
    environment:
      PORT: 3001
      DATABASE_URL: postgresql://portalete:portalete@postgres:5432/portalete
      JWT_SECRET: desenvolvimento-portal-ete
      FRONTEND_URL: http://localhost:3000
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001/api
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  portalete_postgres_data:
